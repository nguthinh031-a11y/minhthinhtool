<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Đoán Tài Xỉu AI Pro - Master Edition</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #1c0609 0%, #050102 100%);
            --glass-bg: rgba(35, 10, 16, 0.75);
            --glass-border: rgba(239, 68, 68, 0.35);
            --text-color: #f8fafc;
            --accent-tai: #ff2a4d;
            --accent-xiu: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Màn hình Loading Hiệu ứng Xoay Tròn Cực Đẹp */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 1, 2, 0.96);
            backdrop-filter: blur(14px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .loader-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid transparent;
            border-top: 4px solid #ff2a4d;
            border-bottom: 4px solid #ff758c;
            border-radius: 50%;
            animation: spinRing 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            box-shadow: 0 0 25px rgba(255, 42, 77, 0.6);
        }

        .ring-inner {
            position: absolute;
            width: 70px;
            height: 70px;
            border: 3px solid transparent;
            border-left: 3px solid #38bdf8;
            border-right: 3px solid #ff4d6d;
            border-radius: 50%;
            animation: spinRingReverse 0.9s linear infinite;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .loader-logo-text {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 42, 77, 0.8);
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRingReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .loading-text {
            font-size: 15px;
            font-weight: 700;
            color: #ff758c;
            letter-spacing: 1.2px;
            text-align: center;
        }

        /* Khung Menu Trong Suốt Red Glassmorphism */
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            box-sizing: border-box;
            transition: all 0.4s ease;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            font-size: 22px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #ff4d6d, #ff758c, #ff2a4d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 13px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #e11d48, #9f1239);
            color: white;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.5);
        }

        .box {
            background: rgba(18, 5, 9, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .session-info {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .session-code {
            font-size: 20px;
            color: #38bdf8;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .prediction-box {
            font-size: 40px;
            font-weight: 900;
            margin: 10px 0;
            letter-spacing: 2px;
            text-shadow: 0 3px 12px rgba(0,0,0,0.6);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: rgba(18, 5, 9, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 12px 8px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card span {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .stat-card strong {
            font-size: 16px;
        }

        .table-container {
            max-height: 170px;
            overflow-y: auto;
            text-align: left;
        }

        .table-container::-webkit-scrollbar {
            width: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: rgba(239, 68, 68, 0.4);
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            color: #94a3b8;
            position: sticky;
            top: 0;
            background: rgba(18, 5, 9, 0.95);
            backdrop-filter: blur(5px);
        }

        .badge-tai { color: var(--accent-tai); font-weight: 900; text-shadow: 0 0 12px rgba(255, 42, 77, 0.5); }
        .badge-xiu { color: var(--accent-xiu); font-weight: 900; text-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
        .badge-win { color: var(--success); font-weight: 700; }
        .badge-lose { color: var(--danger); font-weight: 700; }

        @keyframes flashGreenGlass {
            0% { background: var(--glass-bg); border-color: var(--glass-border); }
            50% { background: rgba(34, 197, 94, 0.4); border-color: rgba(34, 197, 94, 0.9); box-shadow: 0 0 35px rgba(34, 197, 94, 0.6); }
            100% { background: var(--glass-bg); border-color: var(--glass-border); }
        }

        @keyframes flashRedGlass {
            0% { background: var(--glass-bg); border-color: var(--glass-border); }
            50% { background: rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.9); box-shadow: 0 0 35px rgba(239, 68, 68, 0.6); }
            100% { background: var(--glass-bg); border-color: var(--glass-border); }
        }

        .flash-win { animation: flashGreenGlass 0.6s ease 2; }
        .flash-lose { animation: flashRedGlass 0.6s ease 2; }

        .status-msg {
            font-size: 12px;
            font-weight: 600;
            margin-top: 6px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<!-- Màn hình Loading Hiệu Ứng Xoay Tròn Cực Đẹp -->
<div id="loadingScreen">
    <div class="loader-wrapper">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="loader-logo-text">AI PRO</div>
    </div>
    <div class="loading-text" id="loadingText">Đang khởi tạo AI Master... 0%</div>
</div>

<div class="container" id="mainContainer">
    <h2>🔥 TÀI XỈU AI PRO - MASTER</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('tx', this)">Tài Xỉu Thường</button>
        <button class="tab-btn" onclick="switchMode('txmd5', this)">Tài Xỉu MD5</button>
    </div>

    <div class="box">
        <div class="session-info" id="currentSessionLabel">Đang đồng bộ API...</div>
        <div class="session-code" id="sessionCodeDisplay">#-------</div>
        <div class="prediction-box" id="predictionDisplay">--</div>
        <div class="status-msg" id="statusMsg">AI Master đang tính toán cầu...</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span>Tổng số</span>
            <strong id="totalCount">0</strong>
        </div>
        <div class="stat-card">
            <span>Đúng</span>
            <strong id="winCount" style="color: var(--success);">0</strong>
        </div>
        <div class="stat-card">
            <span>Tỷ lệ</span>
            <strong id="winRate">0%</strong>
        </div>
    </div>

    <div class="box table-container">
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Phiên</th>
                    <th>KQ</th>
                    <th>Dự Đoán</th>
                    <th>Trạng Thái</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr><td colspan="4" style="color: #64748b;">Đang tải lịch sử...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_ENDPOINTS = {
        tx: 'https://gossip-marriage-anime-variance.trycloudflare.com/api/tx',
        txmd5: 'https://gossip-marriage-anime-variance.trycloudflare.com/api/txmd5'
    };

    let currentMode = 'tx';
    let lastProcessedSession = null;
    let currentPrediction = null;
    let stats = loadStats();

    function loadStats() {
        let saved = localStorage.getItem(`tx_master_stats_${currentMode}_v5`);
        return saved ? JSON.parse(saved) : { wins: 0, losses: 0, history: [] };
    }

    function saveStats() {
        localStorage.setItem(`tx_master_stats_${currentMode}_v5`, JSON.stringify(stats));
    }

    function switchMode(mode, btnElement) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        
        lastProcessedSession = null;
        currentPrediction = null;
        
        stats = loadStats();
        updateUIStats();
        runInitialLoading();
    }

    function runInitialLoading() {
        const loadingScreen = document.getElementById('loadingScreen');
        loadingScreen.style.opacity = '1';
        loadingScreen.style.display = 'flex';
        
        let percent = 0;
        const textEl = document.getElementById('loadingText');
        
        let interval = setInterval(() => {
            percent += Math.floor(Math.random() * 25) + 15;
            if (percent >= 100) {
                percent = 100;
                clearInterval(interval);
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }, 200);
            }
            textEl.innerText = `Đang tối ưu thuật toán Pro... ${percent}%`;
        }, 60);

        fetchAPI();
    }

    // ==========================================
    // THUẬT TOÁN AI MASTER PRO (Siêu chuẩn xác)
    // ==========================================
    function masterPrediction(historyList) {
        if (!historyList || historyList.length < 4) {
            return Math.random() > 0.5 ? 'Tài' : 'Xỉu';
        }

        let r1 = historyList[0].result; // Mới nhất
        let r2 = historyList[1].result;
        let r3 = historyList[2].result;
        let r4 = historyList[3].result;

        // 1. Nhận diện cầu bệt dài (3 hoặc 4 tay giống nhau liên tiếp) -> Tự động BẺ ngược lại
        if (r1 === r2 && r2 === r3) {
            return r1 === 'Tài' ? 'Xỉu' : 'Tài';
        }

        // 2. Nhận diện nhịp cầu 1-1 (Đảo chiều liên tục: A - B - A - B)
        if (r1 !== r2 && r2 !== r3 && r3 !== r4) {
            return r1; // Bám theo nhịp đảo
        }

        // 3. Nhận diện cầu 2-2 hoặc 3-3 (Nhịp đối xứng kép)
        if (r1 === r2 && r3 === r4 && r1 !== r3) {
            return r1 === 'Tài' ? 'Xỉu' : 'Tài';
        }

        // 4. Phân tích trọng số tần suất xuất hiện gần nhất (Markov Chain bậc 2)
        let taiCount = 0;
        let xiuCount = 0;
        for (let i = 0; i < Math.min(10, historyList.length); i++) {
            if (historyList[i].result === 'Tài') taiCount++;
            else xiuCount++;
        }

        // Cân bằng tỉ lệ: Nếu bên nào xuất hiện áp đảo quá nhiều trong chuỗi ngắn, bẻ ngược lại
        if (taiCount >= 7) return 'Xỉu';
        if (xiuCount >= 7) return 'Tài';

        // Mặc định bám đuôi theo kết quả gần nhất với bộ lọc xu hướng
        return r1 === 'Tài' ? 'Xỉu' : 'Tài';
    }

    async function fetchAPI() {
        try {
            const response = await fetch(API_ENDPOINTS[currentMode], { cache: 'no-store' });
            const data = await response.json();
            
            let sessionId = data.session || data.mahien || data.id || data.phien;
            let currentResult = data.result || data.ketqua || (data.tong !== undefined ? (data.tong >= 11 ? 'Tài' : 'Xỉu') : null);

            if (!sessionId || !currentResult) return;

            document.getElementById('currentSessionLabel').innerText = "Mã Phiên Hiện Tại:";
            document.getElementById('sessionCodeDisplay').innerText = `#${sessionId}`;

            // Khởi tạo phiên đầu tiên chống lệch
            if (lastProcessedSession === null) {
                lastProcessedSession = sessionId;
                if (!currentPrediction) {
                    currentPrediction = masterPrediction(stats.history);
                }
                let predEl = document.getElementById('predictionDisplay');
                predEl.innerText = currentPrediction.toUpperCase();
                predEl.className = `prediction-box ${currentPrediction === 'Tài' ? 'badge-tai' : 'badge-xiu'}`;
                return;
            }

            // Khi server sang phiên mới chính thức
            if (sessionId !== lastProcessedSession) {
                if (currentPrediction) {
                    let isWin = (currentPrediction === currentResult);
                    
                    if (isWin) {
                        stats.wins++;
                        triggerFlashEffect('win', lastProcessedSession);
                    } else {
                        stats.losses++;
                        triggerFlashEffect('lose', lastProcessedSession);
                    }

                    // Chống trùng lặp phiên trong lịch sử riêng
                    let exists = stats.history.some(item => String(item.session) === String(lastProcessedSession));
                    if (!exists) {
                        stats.history.unshift({
                            session: lastProcessedSession,
                            result: currentResult,
                            prediction: currentPrediction,
                            status: isWin ? 'Đúng' : 'Sai'
                        });
                    }

                    if (stats.history.length > 40) stats.history.pop();
                    saveStats();
                    updateUIStats();
                }

                lastProcessedSession = sessionId;
                currentPrediction = masterPrediction(stats.history);

                let predEl = document.getElementById('predictionDisplay');
                predEl.innerText = currentPrediction.toUpperCase();
                predEl.className = `prediction-box ${currentPrediction === 'Tài' ? 'badge-tai' : 'badge-xiu'}`;
            }

        } catch (err) {
            console.error("Lỗi kết nối API:", err);
            document.getElementById('currentSessionLabel').innerText = "Trạng thái:";
            document.getElementById('sessionCodeDisplay').innerText = "Đang kết nối lại...";
        }
    }

    function triggerFlashEffect(type, sessionId) {
        const container = document.getElementById('mainContainer');
        container.classList.remove('flash-win', 'flash-lose');
        void container.offsetWidth; 
        container.classList.add(type === 'win' ? 'flash-win' : 'flash-lose');
        
        document.getElementById('statusMsg').innerHTML = type === 'win'
            ? `<span class="badge-win">🎉 Phiên #${sessionId}: CHÍNH XÁC!</span>`
            : `<span class="badge-lose">❌ Phiên #${sessionId}: SAI!</span>`;
    }

    function updateUIStats() {
        const total = stats.wins + stats.losses;
        document.getElementById('totalCount').innerText = total;
        document.getElementById('winCount').innerText = stats.wins;
        const rate = total > 0 ? ((stats.wins / total) * 100).toFixed(1) : 0;
        document.getElementById('winRate').innerText = rate + '%';

        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = '';
        
        if (stats.history.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="color: #64748b;">Đang ghi nhận lịch sử phiên...</td></tr>`;
            return;
        }

        stats.history.forEach(item => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>#${item.session}</td>
                <td class="${item.result === 'Tài' ? 'badge-tai' : 'badge-xiu'}">${item.result}</td>
                <td class="${item.prediction === 'Tài' ? 'badge-tai' : 'badge-xiu'}">${item.prediction}</td>
                <td class="${item.status === 'Đúng' ? 'badge-win' : 'badge-lose'}">${item.status}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Khởi chạy
    updateUIStats();
    runInitialLoading();

    // Vòng lặp cập nhật real-time mỗi 1.5 giây
    setInterval(() => {
        fetchAPI();
    }, 1500);
</script>

</body>
</html>
